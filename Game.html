<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower defense group project</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/p5.min.js"></script>
    
</head>
<body>
    <main id="game-board">
        <div id="game-controls">
            <div id="wave-counter">WAVE 1</div>
            <div id="game-speed" role="group" aria-label="Game speed">
                <button type="button" data-speed="1" aria-pressed="true">1x</button>
                <button type="button" data-speed="2" aria-pressed="false">2x</button>
                <button type="button" data-speed="3" aria-pressed="false">3x</button>
            </div>
            <button id="auto-wave" type="button" aria-pressed="false">Auto wave: Off</button>
        </div>
    </main>
    <script src="Map/Map.js"></script>
    <script src="player/player.js"></script>
    <script src="Waves/Penge.js"></script>
    <script src="Tårnet/Skud.js"></script>
    <script src="Tårnet/tårnet.js"></script>
    <script src="Waves/waves.js"></script>
    <script src="Monster/monster.js"></script>
</body>
</html>
